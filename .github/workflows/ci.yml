name: CI

on:
  push:
    branches: [main, v0.9-stable-core, v1.0-cross-platform]
  pull_request:
    branches: [main, v0.9-stable-core, v1.0-cross-platform]

permissions:
  contents: read

jobs:
  rust:
    name: macOS checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - name: Unit, CLI, PTY and disposable SSH/SFTP checks
        env:
          LAZYTERM_SFTP_FIXTURE: '1'
        run: cargo test --locked -- --test-threads=1
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  linux:
    name: Linux checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build and fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes openssh-client openssh-server procps lsof iproute2 libwayland-dev libxkbcommon-dev dbus-x11 gnome-keyring libglib2.0-bin
          sudo mkdir -p /run/sshd
      - run: cargo fmt --check
      - name: Unit, CLI, PTY and disposable SSH/SFTP checks
        env:
          LAZYTERM_SFTP_FIXTURE: '1'
        run: cargo test --locked -- --test-threads=1
      - name: Isolated Linux Secret Service checks
        run: bash scripts/test-linux-credentials.sh
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
